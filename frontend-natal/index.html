<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1a33" />
    <title>mimemora</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="mimos e memórias para os dias especiais" />
    <meta property="og:site_name" content="mimemora" />
    <meta property="og:title" content="mimemora" />
    <meta property="og:description" content="mimos e memórias para os dias especiais" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Se o site falhar ao iniciar, mostra o erro na tela em vez de deixar só o fundo azul.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.hasChildNodes()) r.innerHTML = '<pre style="color:#fff;padding:16px;white-space:pre-wrap;font:13px monospace">Erro ao iniciar o site:\n' + (e.message || e.error) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
